<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

    <title>Frontend Mentor | Typing Speed Test</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">

    <script src="app.js" defer></script>
</head>

<body>

    <main class="main">

        <header class="header">

            <!-- Header top -->
            <div class="header__information">

                <picture class="header__logo">
                    <source media="(min-width: 600px)" srcset="assets/images/logo-large.svg">

                    <img src="assets/images/logo-small.svg" alt="Typing Speed Test" class="header__logo-image">
                </picture>

                <div class="header__personal-best">

                    <img src="assets/images/icon-personal-best.svg" alt="" class="header__personal-best-icon">

                    <p class="header__personal-best-text">

                        <span class="header__personal-best-label">
                            Personal best:
                        </span>

                        <span id="WPM-value" class="header__personal-best-value">
                            00 WPM
                        </span>

                    </p>

                </div>

            </div>


            <!-- Interactive header -->
            <div class="header__interactive">

                <!-- Results -->
                <div class="header__results">

                    <div class="header__result">

                        <span class="header__result-label">
                            WPM:
                        </span>

                        <span class="header__result-value header__result-value--wpm">
                            0
                        </span>

                    </div>


                    <div class="header__result">

                        <span class="header__result-label">
                            Accuracy:
                        </span>

                        <span class="header__result-value header__result-value--accuracy">
                            100%
                        </span>

                    </div>


                    <div class="header__result">

                        <span class="header__result-label">
                            Time:
                        </span>

                        <span class="header__result-value header__result-value--time">
                            60
                        </span>

                    </div>

                </div>


                <!-- Test options -->
                <div class="header__options">

                    <div class="header__option-group">

                        <span class="header__option-label">
                            Difficulty:
                        </span>

                        <div class="header__option-buttons">

                            <button type="button" class="header__option-button header__option-button--desktop-only">
                                Easy
                            </button>

                            <button type="button" class="header__option-button header__option-button--desktop-only">
                                Medium
                            </button>

                            <button type="button" class="header__option-button">
                                <span>Hard</span>

                                <i class="fa-solid fa-angle-down"></i>
                            </button>

                        </div>

                    </div>


                    <div class="header__option-divider"></div>


                    <div class="header__option-group">

                        <span class="header__option-label">
                            Mode:
                        </span>

                        <div class="header__option-buttons">

                            <button type="button" class="header__option-button">
                                <span>Timed (60s)</span>

                                <i class="fa-solid fa-angle-down"></i>
                            </button>

                            <button type="button" class="header__option-button header__option-button--desktop-only">
                                Passage
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </header>


        <!-- Typing test -->
        <section id="typing-test-app" class="typing-test-app typing-test-app--not-started">

            <div class="typing-test-app__container">

                <!-- Passage -->
                <div id="typing-text" class="typing-text" aria-live="polite"></div>


                <!-- Start overlay -->
                <div class="typing-test-app__start">

                    <button type="button" class="typing-test-app__start-button">
                        Start Typing Test
                    </button>

                    <p class="typing-test-app__start-hint" id="typing-test-app__start-hint">
                        Or click the text and start typing
                    </p>

                </div>

            </div>


            <!-- Restart -->
            <div class="typing-test-app__restart">

                <div class="typing-test-app__restart-divider"></div>

                <button type="button" class="typing-test-app__restart-button" id="typing-test-app__restart-button">
                    Restart Test
                </button>

            </div>

        </section>

    </main>

</body>

</html>
