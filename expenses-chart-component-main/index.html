<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <!-- Fonts -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Sora&display=swap" rel="stylesheet">
  <!-- Css -->
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Expenses chart component</title>

</head>
<body>

<main>

    <section class="expenses-chart">

      <!-- Balance -->
      <div class="expenses-chart__balance">

        <div class="expenses-chart__balance-info">
          <h2 class="expenses-chart__balance-title">
            My balance
          </h2>

          <p class="expenses-chart__balance-amount">
            $921.48
          </p>
        </div>

        <div class="expenses-chart__balance-logo">
          <img src="images/logo.svg" alt="">
        </div>

      </div>


      <!-- Chart -->
      <div class="expenses-chart__content">

        <h1 class="expenses-chart__title">
          Spending - Last 7 days
        </h1>


        <div class="expenses-chart__bars">

          <!-- Example structure generated by JS:

          <div class="expenses-chart__day">
            <div class="expenses-chart__bar"></div>
            <p class="expenses-chart__day-label">mon</p>
          </div>

          -->

           <div class="expenses-chart__day">
            <div class="expenses-chart__bar"></div>
            <p class="expenses-chart__day-label">Mon</p>
          </div>


           <div class="expenses-chart__day">
            <div class="expenses-chart__bar"></div>
            <p class="expenses-chart__day-label">Tue</p>
          </div>



           <div class="expenses-chart__day">
            <div class="expenses-chart__bar"></div>
            <p class="expenses-chart__day-label">Wed</p>
          </div>


           <div class="expenses-chart__day">
            <div class="expenses-chart__bar"></div>
            <p class="expenses-chart__day-label">Thur</p>
          </div>


           <div class="expenses-chart__day">
            <div class="expenses-chart__bar"></div>
            <p class="expenses-chart__day-label">Fri</p>
          </div>


           <div class="expenses-chart__day">
            <div class="expenses-chart__bar"></div>
            <p class="expenses-chart__day-label">Sat</p>
          </div>



           <div class="expenses-chart__day">
            <div class="expenses-chart__bar"></div>
            <p class="expenses-chart__day-label">Sun</p>
          </div>

        </div>


        <!-- Summary -->
        <div class="expenses-chart__summary">

          <div class="expenses-chart__summary-total">
            <p class="expenses-chart__summary-label">
              Total this month
            </p>

            <p class="expenses-chart__summary-amount">
              $478.33
            </p>
          </div>


          <div class="expenses-chart__summary-change">

            <p class="expenses-chart__summary-percentage">
              +2.4%
            </p>

            <p class="expenses-chart__summary-period">
              from last month
            </p>

          </div>

        </div>

      </div>

    </section>

  </main>






<!--

  wed

  sun

  Total this month

  +2.4%
  from last month
   -->

    Coded by <a href="#">Fatih Keles</a>.
  </footer>
</body>
</html>
